<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <!-- Adinkrahene — concentric circles, "chief of the symbols" -->
    <g id="adinkra-hene" stroke="currentColor" fill="none" stroke-width="3">
      <circle cx="0" cy="0" r="34" />
      <circle cx="0" cy="0" r="22" />
      <circle cx="0" cy="0" r="10" />
    </g>

    <!-- Gye Nyame — "except for God", paired scrolls -->
    <g id="gye-nyame" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M -30 20 C -30 -20, 5 -25, 5 0 C 5 20, -18 22, -18 4 C -18 -8, -4 -10, -4 0" />
      <path d="M 30 -20 C 30 20, -5 25, -5 0 C -5 -20, 18 -22, 18 -4 C 18 8, 4 10, 4 0" />
    </g>

    <!-- Sankofa — stylised bird reaching back -->
    <g id="sankofa" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -20 26 C -20 0, -20 -20, 4 -26 C 20 -30, 28 -18, 20 -10 C 14 -4, 4 -8, 6 -16" />
      <circle cx="22" cy="-16" r="3.2" fill="currentColor" stroke="none" />
      <path d="M -20 26 L -20 10 M -20 26 L -8 26" />
    </g>

    <!-- Dwennimmen — ram's horns, humility & strength -->
    <g id="dwennimmen" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M 0 -22 C -26 -22, -26 10, -4 10 C -14 10, -14 -6, 0 -6" />
      <path d="M 0 -22 C 26 -22, 26 10, 4 10 C 14 10, 14 -6, 0 -6" />
      <line x1="0" y1="-6" x2="0" y2="22" />
    </g>

    <!-- Akoma — the heart, patience & tolerance -->
    <path id="akoma" d="M 0 24 C -26 4, -26 -20, -6 -20 C 0 -20, 0 -12, 0 -12 C 0 -12, 0 -20, 6 -20 C 26 -20, 26 4, 0 24 Z"
      stroke="currentColor" fill="none" stroke-width="3" stroke-linejoin="round" />

    <!-- Nyame Dua — altar of God, protection -->
    <g id="nyame-dua" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="20" />
      <line x1="-18" y1="-16" x2="18" y2="-16" />
      <line x1="-18" y1="-16" x2="-18" y2="-4" />
      <line x1="18" y1="-16" x2="18" y2="-4" />
      <line x1="-14" y1="20" x2="14" y2="20" />
    </g>

    <!-- Nkyinkyim — twisting, life's dynamism -->
    <path id="nkyinkyim" d="M -22 -22 L -6 -22 L -6 -6 L 10 -6 L 10 10 L 26 10 L 26 26"
      stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Duafe — wooden comb, feminine care -->
    <g id="duafe" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M -14 -24 C -22 -24, -22 4, -14 4 L 14 4 C 22 4, 22 -24, 14 -24" />
      <line x1="-14" y1="4" x2="-14" y2="26" />
      <line x1="-7" y1="4" x2="-7" y2="26" />
      <line x1="0" y1="4" x2="0" y2="26" />
      <line x1="7" y1="4" x2="7" y2="26" />
      <line x1="14" y1="4" x2="14" y2="26" />
    </g>
  </defs>

  <!-- Light-mode variant: green-deep line color, low opacity for a cream background -->
  <g color="#1B6E54" opacity="0.10">
    <use href="#gye-nyame"   x="70"  y="60"  transform="rotate(-8 70 60)" />
    <use href="#adinkra-hene" x="330" y="50" />
    <use href="#sankofa"     x="560" y="90"  transform="rotate(6 560 90)" />
    <use href="#dwennimmen"  x="150" y="230" />
    <use href="#akoma"       x="420" y="230" transform="rotate(-4 420 230)" />
    <use href="#nyame-dua"   x="30"  y="420" />
    <use href="#nkyinkyim"   x="260" y="410" />
    <use href="#duafe"       x="500" y="420" transform="rotate(5 500 420)" />
    <use href="#gye-nyame"   x="600" y="560" transform="rotate(15 600 560) scale(0.8)" />
    <use href="#adinkra-hene" x="120" y="580" transform="scale(0.75)" />
    <use href="#sankofa"     x="380" y="600" transform="rotate(-10 380 600) scale(0.85)" />
  </g>
</svg>
